<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PuntoSeguro Market, administración</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 14px}.f input,.f textarea,.f select{width:100%}.r2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--ln)}.r2 input[type=number]{width:105px}.im{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.im span{position:relative}.im img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:block}.im button{position:absolute;top:-6px;right:-6px;border-radius:99px;border:0;background:var(--red);color:#fff;cursor:pointer;width:20px;height:20px;padding:0;line-height:20px}.nm{flex:1;min-width:180px}</style></head>
<body><main><h1>Administración</h1><p><a href="/">Ver la tienda</a></p><div id="app"></div></main><div id="ts" role="status"></div>
<script>
const $=s=>document.querySelector(s),m=n=>'$'+Number(n).toLocaleString('es-MX');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let K=sessionStorage.getItem('ak')||'',D=null,TB='prod',PT=[],MS=null,AM=null,AMK=null,SEL=0;
function toast(t){const e=$('#ts');e.textContent=t;e.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='',3200)}
async function api(u,o={}){const h={'x-admin-key':K};if(o.body&&!(o.body instanceof FormData)){h['Content-Type']='application/json';o={...o,body:JSON.stringify(o.body)}}const r=await fetch(u,{...o,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error del servidor');return d}
async function load(msg){try{D=await api('/api/admin/catalogo');sessionStorage.setItem('ak',K)}catch(e){D=null;msg=K?e.message:''}draw(msg)}
function draw(msg){const a=$('#app');
if(!D){a.innerHTML=`<div class="box" style="max-width:420px"><label for="k">Clave de administrador (ADMIN_KEY de tu archivo .env)</label><input id="k" type="password" style="width:100%"><p><button class="b" data-a="in">Entrar</button></p>${msg?`<p style="color:var(--red)">${esc(msg)}</p>`:''}</div>`;return}
const padres=D.categorias.filter(c=>!c.padre_id),subs=D.categorias.filter(c=>c.padre_id);
const nl=MS?MS.mensajes.filter(x=>!x.leido).length:0;
const tabs=`<div class="tabs">${[['prod','Productos'],['pts','Puntos Seguros'],['msg','Mensajes'+(nl?' ('+nl+')':'')]].map(x=>`<button class="b2 ${TB==x[0]?'on':''}" data-a="tb" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
if(TB==='pts'){a.innerHTML=tabs+ptsV();initAM();return}
if(TB==='msg'){a.innerHTML=tabs+msgV();return}
a.innerHTML=tabs+`<div class="box"><h2 style="margin-top:0">Nuevo producto</h2><div class="f">
<div><label for="nombre">Nombre</label><input id="nombre"></div>
<div><label for="cat">Categoría (elige o escribe una nueva)</label><input id="cat" list="lc"></div>
<div><label for="sub">Subcategoría</label><input id="sub" list="ls"></div>
<div><label for="mar">Marca</label><input id="mar" list="lm"></div>
<div><label for="pre">Precio</label><input id="pre" type="number" min="0" step="0.01"></div>
<div><label for="ant">Precio anterior (solo si está en oferta)</label><input id="ant" type="number" min="0" step="0.01"></div>
<div><label for="stk">Stock</label><input id="stk" type="number" min="0" value="1"></div>
<div><label for="emo">Emoji (si no hay foto)</label><input id="emo" placeholder="📦"></div>
<div><label for="col">Color de fondo</label><input id="col" type="color" value="#9db7c4"></div></div>
<label for="desc">Descripción</label><textarea id="desc" rows="3"></textarea>
<label><input type="checkbox" id="nue"> Marcar como nuevo</label>
<label for="fot">Fotos (JPG, PNG o WEBP, hasta 4 MB cada una)</label><input id="fot" type="file" accept="image/*" multiple>
<p><button class="b" data-a="add">Guardar producto</button></p>
<datalist id="lc">${padres.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist><datalist id="ls">${subs.map(c=>`<option value="${esc(c.nombre)}">`).join('')}</datalist><datalist id="lm">${D.marcas.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
<h2>Productos (${D.productos.length})</h2>${D.productos.length?D.productos.map(p=>`<div class="r2"><div class="nm"><b>${esc(p.nombre)}</b><div class="mut">${esc(p.sub)}</div></div>
<div class="im">${p.imgs.map(i=>`<span><img src="${esc(i.ruta)}" alt=""><button data-a="di" data-v="${i.id}" aria-label="Quitar foto">✕</button></span>`).join('')}<label class="b2">Agregar fotos<input type="file" accept="image/*" multiple hidden data-up="${p.id}"></label></div>
<label>Precio <input id="p${p.id}" type="number" min="0" step="0.01" value="${p.precio}"></label><label>Anterior <input id="a${p.id}" type="number" min="0" step="0.01" value="${p.precio_anterior||''}"></label><label>Stock <input id="s${p.id}" type="number" min="0" value="${p.stock}"></label>
<button class="b" data-a="sv" data-v="${p.id}">Guardar</button><button class="b2" data-a="dp" data-v="${p.id}">Eliminar</button></div>`).join(''):'<p>Todavía no hay productos. Crea el primero con el formulario de arriba.</p>'}`}
/* ---- Puntos Seguros: mapa para ubicar el pin y buscador de direcciones (OpenStreetMap / Nominatim) ---- */
const P0=()=>PT.find(x=>x.id==SEL)||{};
function ptsV(){const p=P0();return`<div class="box"><h2 style="margin-top:0">${SEL?'Editar Punto Seguro':'Nuevo Punto Seguro'}</h2><p class="mut">Busca la dirección o haz clic en el mapa para colocar el pin exactamente donde está el punto. Al guardar con el pin colocado por ti, se marca como ubicación verificada.</p>
<div class="row"><input id="gq" placeholder="Buscar dirección o lugar (ej. Galerías Tabasco 2000, Villahermosa)" style="flex:1;min-width:220px"><button class="b2" data-a="geo">Buscar</button></div><div id="amap" style="height:340px;margin:10px 0;border-radius:10px;border:1px solid var(--ln)"></div>
<div class="f"><div><label for="pn">Nombre</label><input id="pn" value="${esc(p.nombre||'')}"></div><div><label for="pd">Dirección</label><input id="pd" value="${esc(p.direccion||'')}"></div><div><label for="ph">Horario</label><input id="ph" value="${esc(p.horario||'')}" placeholder="Lun a Dom 11:00 a 21:00"></div><div><label for="pla">Latitud</label><input id="pla" value="${p.lat??''}" readonly></div><div><label for="plo">Longitud</label><input id="plo" value="${p.lng??''}" readonly></div></div>
<label for="pe">Descripción / recomendaciones</label><textarea id="pe" rows="2">${esc(p.descripcion||'')}</textarea><label><input type="checkbox" id="pa" ${p.id&&!p.activo?'':'checked'}> Activo (visible para los usuarios)</label>
<p><button class="b" data-a="psv">${SEL?'Guardar cambios':'Crear Punto Seguro'}</button> ${SEL?'<button class="b2" data-a="pnew">Cancelar edición</button>':''}</p></div>
<h2>Puntos Seguros (${PT.length})</h2>${PT.length?PT.map(x=>`<div class="r2"><div class="nm"><b>${esc(x.nombre)}</b> ${x.verificado?'<span class="vf">✔ verificado</span>':'<span class="no">ubicación aproximada</span>'} ${x.activo?'':'<span class="mut">(oculto)</span>'}<div class="mut">${esc(x.direccion)}</div></div><button class="b2" data-a="ped" data-v="${x.id}">Editar</button><button class="b2" data-a="pdl" data-v="${x.id}">Eliminar</button></div>`).join(''):'<p>Aún no hay Puntos Seguros.</p>'}`}
async function initAM(){if(!window.L){await new Promise(ok=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=ok;document.head.appendChild(s)})}
const el=$('#amap');if(!el)return;if(!window.L){el.innerHTML='<p class="mut" style="padding:16px">No se pudo cargar el mapa (revisa tu conexión).</p>';return}
const p=P0(),c=p.lat!=null?[p.lat,p.lng]:[17.9892,-92.9475];AM=L.map(el).setView(c,p.lat!=null?16:12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(AM);
AMK=p.lat!=null?L.marker(c).addTo(AM):null;AM.on('click',e=>pin(e.latlng.lat,e.latlng.lng))}
function pin(lat,lng){if(!AM)return;lat=+lat.toFixed(6);lng=+lng.toFixed(6);if(AMK)AMK.setLatLng([lat,lng]);else AMK=L.marker([lat,lng]).addTo(AM);$('#pla').value=lat;$('#plo').value=lng;$('#pla').dataset.m=1}
async function geo(){const q=$('#gq').value.trim();if(!q)return;try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycode=mx&q='+encodeURIComponent(q)).then(x=>x.json());if(!r.length){toast('No se encontró esa dirección. Haz clic en el mapa para colocar el pin');return}AM.setView([+r[0].lat,+r[0].lon],17);pin(+r[0].lat,+r[0].lon);if(!$('#pd').value)$('#pd').value=r[0].display_name}catch(e){toast('No se pudo buscar. Haz clic en el mapa para colocar el pin')}}
/* ---- Mensajes de contacto y suscriptores ---- */
function msgV(){if(!MS)return'<p class="mut">Cargando…</p>';return`<h2 style="margin-top:0">Mensajes de contacto (${MS.mensajes.length})</h2>${MS.mensajes.length?MS.mensajes.map(x=>`<div class="box" style="margin-bottom:10px;${x.leido?'opacity:.7':''}"><b>${esc(x.nombre)}</b> <a href="mailto:${esc(x.email)}?subject=Re: tu mensaje en PuntoSeguro Market">${esc(x.email)}</a> <span class="mut sm">${x.f}</span> ${x.leido?'':'<span class="vf">nuevo</span>'}<p style="white-space:pre-wrap;margin:6px 0">${esc(x.mensaje)}</p><button class="b2" data-a="mrd" data-v="${x.id}|${x.leido?0:1}">${x.leido?'Marcar como no leído':'Marcar como leído'}</button> <button class="b2" data-a="mdl" data-v="${x.id}">Eliminar</button></div>`).join(''):'<p class="mut">No hay mensajes.</p>'}<h2>Suscriptores del boletín (${MS.suscriptores.length})</h2>${MS.suscriptores.length?`<div class="box">${MS.suscriptores.map(x=>`<div>${esc(x.email)} <span class="mut sm">${x.f}</span></div>`).join('')}</div>`:'<p class="mut">Aún no hay suscriptores.</p>'}`}
async function loadAdm(){PT=await api('/api/admin/puntos');MS=await api('/api/admin/mensajes');draw()}
async function upload(id,files){let fail=0;for(const f of files){const fd=new FormData();fd.append('imagen',f);try{await api('/api/productos/'+id+'/imagenes',{method:'POST',body:fd})}catch(e){fail++}}return fail}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v,g=i=>$('#'+i).value.trim();
try{if(a==='in'){K=g('k');await load()}
else if(a==='tb'){TB=v;if(v!=='prod')await loadAdm();else draw()}
else if(a==='geo')await geo();
else if(a==='ped'){SEL=+v;draw()}else if(a==='pnew'){SEL=0;draw()}
else if(a==='psv'){const b={nombre:g('pn'),direccion:g('pd'),horario:g('ph'),descripcion:g('pe'),lat:g('pla'),lng:g('plo'),activo:$('#pa').checked,verificado:SEL?(P0().verificado||$('#pla').dataset.m?1:0):($('#pla').dataset.m?1:0)};if(SEL)await api('/api/admin/puntos/'+SEL,{method:'PUT',body:b});else await api('/api/admin/puntos',{method:'POST',body:b});toast('Punto Seguro guardado');SEL=0;await loadAdm()}
else if(a==='pdl'){if(!confirm('¿Eliminar este Punto Seguro?'))return;await api('/api/admin/puntos/'+v,{method:'DELETE'});await loadAdm()}
else if(a==='mrd'){const[i,l]=v.split('|');await api('/api/admin/mensajes/'+i,{method:'PUT',body:{leido:+l}});await loadAdm()}
else if(a==='mdl'){if(!confirm('¿Eliminar este mensaje?'))return;await api('/api/admin/mensajes/'+v,{method:'DELETE'});await loadAdm()}
else if(a==='add'){const r=await api('/api/admin/productos',{method:'POST',body:{nombre:g('nombre'),descripcion:g('desc'),categoria:g('cat'),subcategoria:g('sub'),marca:g('mar'),precio:g('pre'),precio_anterior:g('ant'),stock:g('stk'),es_nuevo:$('#nue').checked,emoji:g('emo'),color:$('#col').value}});const f=await upload(r.id,$('#fot').files);toast(f?`Producto creado, pero ${f} foto(s) no se subieron (usa JPG, PNG o WEBP de hasta 4 MB)`:'Producto creado');await load()}
else if(a==='sv'){await api('/api/admin/productos/'+v,{method:'PUT',body:{precio:g('p'+v),precio_anterior:g('a'+v),stock:g('s'+v)}});toast('Cambios guardados');await load()}
else if(a==='dp'){if(!confirm('¿Eliminar este producto y sus fotos?'))return;await api('/api/admin/productos/'+v,{method:'DELETE'});toast('Producto eliminado');await load()}
else if(a==='di'){await api('/api/admin/imagenes/'+v,{method:'DELETE'});await load()}}catch(x){toast(x.message)}});
document.addEventListener('change',async e=>{const id=e.target.dataset.up;if(!id)return;const f=await upload(id,e.target.files);if(f)toast(f+' foto(s) no se subieron (usa JPG, PNG o WEBP de hasta 4 MB)');await load()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='k'){K=e.target.value.trim();load()}});
load();
</script></body></html>
